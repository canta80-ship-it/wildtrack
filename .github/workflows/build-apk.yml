name: Build WildTrack APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WILDTRACK_KEYSTORE: ${{ runner.temp }}/wildtrack-signing.jks
      WILDTRACK_STORE_PASSWORD: ${{ secrets.WILDTRACK_STORE_PASSWORD }}
      WILDTRACK_KEY_ALIAS: ${{ secrets.WILDTRACK_KEY_ALIAS }}
      WILDTRACK_KEY_PASSWORD: ${{ secrets.WILDTRACK_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3
          cache: true
      - name: Restore source folders
        run: |
          mkdir -p lib/screens lib/services lib/models tool
          for file in *_screen.dart; do [ ! -f "$file" ] || mv "$file" lib/screens/; done
          for file in *_service.dart; do [ ! -f "$file" ] || mv "$file" lib/services/; done
          for file in sighting.dart track_point.dart track_session.dart; do [ ! -f "$file" ] || mv "$file" lib/models/; done
          [ ! -f main.dart ] || mv main.dart lib/
          [ ! -f prepare_android.py ] || mv prepare_android.py tool/
      - name: Restore retained signing identity
        env:
          KEYSTORE_B64: ${{ secrets.WILDTRACK_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Configure the original signing key before distributing an update."; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$WILDTRACK_KEYSTORE"
          chmod 600 "$WILDTRACK_KEYSTORE"
      - name: Generate Android project
        run: |
          flutter create --platforms=android --org it.wildtrack --project-name wildtrack_mvp --no-pub .
          rm -f test/widget_test.dart
          python3 tool/prepare_android.py
      - name: Prepare verified nature data
        run: python3 prepare_nature.py
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release
      - name: Prepare APK
        run: cp build/app/outputs/flutter-apk/app-release.apk WildTrack-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WildTrack-APK
          path: WildTrack-release.apk
          if-no-files-found: error
          retention-days: 30
