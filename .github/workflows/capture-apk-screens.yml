name: Capture WildTrack APK Screens
on:
  push:
    branches: [next-release]
    paths:
      - '.github/workflows/capture-apk-screens.yml'
      - 'capture_apk_screens.sh'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Download exact APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/11181164236/zip" \
            -o WildTrack-APK.zip
          unzip -o WildTrack-APK.zip
          test -f WildTrack-release.apk
          ls -lh WildTrack-release.apk
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Boot Android emulator and capture app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 2
          ram-size: 4096M
          heap-size: 1024M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            chmod +x capture_apk_screens.sh
            APK_PATH="$PWD/WildTrack-release.apk" SCREENSHOT_DIR="$PWD/apk-screens" ./capture_apk_screens.sh
      - name: List screenshots
        if: always()
        run: find apk-screens -maxdepth 1 -type f -name '*.png' -printf '%f %s bytes\n' | sort || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WildTrack-real-APK-screens
          path: apk-screens/*.png
          if-no-files-found: error
          retention-days: 30
