name: Package verified WildTrack delivery
on:
  push:
    branches: [delivery-0-7-12]
    paths: [.github/workflows/delivery-artifacts.yml]
permissions:
  contents: read
  actions: read
jobs:
  delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Wait for exact verified application build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          for _ in range(240):
              q=urllib.request.Request('https://api.github.com/repos/canta80-ship-it/wildtrack/actions/runs/37118008618',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(q) as r:d=json.load(r)
              assert d['head_sha']=='d59771a903a14050402c02f78c778d06f16388ed'
              if d['status']=='completed':
                  assert d['conclusion']=='success',d['conclusion']
                  break
              time.sleep(5)
          else:raise TimeoutError('Build not complete')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: WildTrack-APK
          run-id: 37118008618
          github-token: ${{ github.token }}
          path: apk
      - name: Check retained update signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs apk/WildTrack-release.apk > signing.txt
          ACTUAL_CERT=$(sed -n 's/.*certificate SHA-256 digest: //p' signing.txt | head -n 1)
          test "$ACTUAL_CERT" = "891acf5af65eaaff81d0a1f493d64f2b21311e9c64f2801db5ad5f015bcf42bc"
      - name: Prepare bounded delivery parts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('transfer');root.mkdir()
          p=Path('apk/WildTrack-release.apk')
          with p.open('rb') as f:
              for i in range(8):
                  b=f.read(24*1024*1024)
                  if not b:break
                  (root/f'WildTrack.part-{i}').write_bytes(b)
              assert not f.read(1),'Too many parts'
          (root/'SHA256.txt').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  WildTrack-0.7.13.apk\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: WildTrack-delivery-checks
          path: transfer/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: WildTrack-part-0
          path: transfer/WildTrack.part-0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: WildTrack-part-1
          path: transfer/WildTrack.part-1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: WildTrack-part-2
          path: transfer/WildTrack.part-2
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: WildTrack-part-3
          path: transfer/WildTrack.part-3
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: WildTrack-part-4
          path: transfer/WildTrack.part-4
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: WildTrack-part-5
          path: transfer/WildTrack.part-5
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: WildTrack-part-6
          path: transfer/WildTrack.part-6
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: WildTrack-part-7
          path: transfer/WildTrack.part-7
          if-no-files-found: ignore

  native-tools:
    needs: delivery
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d59771a903a14050402c02f78c778d06f16388ed
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: WildTrack-APK
          run-id: 37118008618
          github-token: ${{ github.token }}
          path: tested-apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test premium checklist and GPS return on signed Android APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 tool/outdoor_android_smoke.py tested-apk/WildTrack-release.apk it.wildtrack.preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WildTrack-outdoor-native-results
          path: android-results/
          if-no-files-found: warn
