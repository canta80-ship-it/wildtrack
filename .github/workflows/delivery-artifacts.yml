name: Package verified WildTrack delivery
on:
  push:
    branches: [delivery-0-7-12]
permissions:
  contents: read
  actions: read
jobs:
  delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Wait for exact verified application build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          u='https://api.github.com/repos/canta80-ship-it/wildtrack/actions/runs/37107020536'
          for _ in range(240):
              q=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(q) as r: d=json.load(r)
              assert d['head_sha']=='ff28b5c360e1a43f5bcc3f1cef35057003b121f7'
              if d['status']=='completed':
                  assert d['conclusion']=='success', d['conclusion']
                  break
              time.sleep(5)
          else: raise TimeoutError('Build not completed')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: WildTrack-APK
          run-id: 37107020536
          github-token: ${{ github.token }}
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: WildTrack-interface-previews
          run-id: 37107020536
          github-token: ${{ github.token }}
          path: previews
      - name: Prepare bounded delivery parts and artwork checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, shutil
          root=Path('transfer');root.mkdir()
          p=Path('apk/WildTrack-release.apk')
          with p.open('rb') as f:
              for i in range(8):
                  b=f.read(24*1024*1024)
                  if not b: break
                  (root/f'WildTrack.part-{i}').write_bytes(b)
              assert not f.read(1),'Too many parts'
          (root/'SHA256.txt').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  WildTrack-0.7.12.apk\n')
          picks=Path('selected-previews');picks.mkdir()
          names=('lepre','scoiattolo','upupa','gheppio','assiolo','nibbio')
          for p in Path('previews').glob('*.png'):
              if any(n in p.name.lower() for n in names): shutil.copy(p,picks/p.name)
          print('Preview files:',[p.name for p in picks.iterdir()])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: WildTrack-delivery-checks
          path: |
            transfer/SHA256.txt
            selected-previews/
      - uses: actions/upload-artifact@v4
        with:
          name: WildTrack-part-0
          path: transfer/WildTrack.part-0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: WildTrack-part-1
          path: transfer/WildTrack.part-1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: WildTrack-part-2
          path: transfer/WildTrack.part-2
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: WildTrack-part-3
          path: transfer/WildTrack.part-3
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: WildTrack-part-4
          path: transfer/WildTrack.part-4
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: WildTrack-part-5
          path: transfer/WildTrack.part-5
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: WildTrack-part-6
          path: transfer/WildTrack.part-6
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: WildTrack-part-7
          path: transfer/WildTrack.part-7
          if-no-files-found: ignore
