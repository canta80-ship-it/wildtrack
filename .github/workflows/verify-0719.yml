name: Verify 0.7.19 upgrade and live feed sources
on:
  push:
    branches: [interface-reference]
    paths: [.github/workflows/verify-0719.yml]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 21cbfe99534e76c411d6bfd553289bb0a7e85b08
      - name: Probe live news sources
        run: |
          python3 - <<'PY'
          import urllib.request,json,time,re,xml.etree.ElementTree as ET
          urls=[
          'https://www.mountainblog.it/wp-json/wp/v2/posts?per_page=12&orderby=date&order=desc&_fields=id,date,date_gmt,link,title,excerpt,categories&_wt='+str(time.time_ns()),
          'https://www.mountainblog.it/feed/?wt='+str(time.time_ns()),
          'https://www.parks.it/news/index.php?wt='+str(time.time_ns())]
          for url in urls:
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'WildTrack/0.7.19','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=20) as r: data=r.read().decode('utf-8'); print(url.split('?')[0],r.status,flush=True)
              if 'wp-json' in url:
                rows=json.loads(data); print('WP latest dates:',[r.get('date_gmt') for r in rows[:3]])
              elif '/feed/' in url:
                root=ET.fromstring(data); print('RSS latest dates:',[e.findtext('pubDate') for e in root.findall('.//item')[:3]])
              else:
                links=list(re.finditer(r"""href=["']([^"']*dettaglio\.php\?id=\d+[^"']*)["'][^>]*>(.*?)</a>""",data,re.S|re.I))
                dates=[]
                for m in links:
                  fragment=re.sub('<[^>]+>',' ',data[m.end():m.end()+1800])
                  date=re.search(r'\b(\d{1,2})\s+(Gen|Feb|Mar|Apr|Mag|Giu|Lug|Ago|Set|Ott|Nov|Dic)\s+(\d{2,4})\b',fragment,re.I)
                  if date: dates.append(date.group(0))
                print('Parks matching articles:',len(links),'dates:',dates[:8])
            except Exception as e: print('Source unavailable:',type(e).__name__,str(e))
          PY
      - name: Wait for exact signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          for attempt in range(120):
            req=urllib.request.Request('https://api.github.com/repos/canta80-ship-it/wildtrack/actions/runs/37349887002',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
            run=json.load(urllib.request.urlopen(req))
            if run['status']=='completed':
              assert run['conclusion']=='success',run['conclusion']
              break
            time.sleep(5)
          else: raise RuntimeError('Build still running')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: WildTrack-APK
          run-id: 37349887002
          github-token: ${{ github.token }}
          path: new-apk
      - uses: actions/download-artifact@v4
        with:
          name: WildTrack-APK
          run-id: 37150893942
          github-token: ${{ github.token }}
          path: old-apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install old-apk/WildTrack-release.apk
            adb root
            adb wait-for-device
            adb shell 'echo wildtrack-existing-data > /data/user/0/it.wildtrack.preview/cache/upgrade-sentinel'
            adb install -r new-apk/WildTrack-release.apk
            adb shell cat /data/user/0/it.wildtrack.preview/cache/upgrade-sentinel | grep wildtrack-existing-data
            adb shell dumpsys package it.wildtrack.preview | grep "versionName=0.7.19"
            adb shell pm grant it.wildtrack.preview android.permission.POST_NOTIFICATIONS
            adb shell am start -W -n it.wildtrack.preview/it.wildtrack.wildtrack_mvp.MainActivity
            adb shell dumpsys activity activities | grep it.wildtrack.preview
