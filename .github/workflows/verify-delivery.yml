# Verifies the delivered production APK built from 7ab06d25f5188383e0d2b51aa846a91f34af2a64.
# Application sources are unchanged; this rerun corrects an off-screen logout assertion.
name: Verify WildTrack signed delivery
on:
  push:
    branches: [interface-reference]
    paths: [.github/workflows/verify-delivery.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  signed_release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: WildTrack-APK
          run-id: 36952010186
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: tested-apk
      - name: Download previously delivered APK for coexistence check
        uses: actions/download-artifact@v4
        with:
          name: WildTrack-APK
          run-id: 36934000179
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: legacy-apk
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test signed production APK on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 tool/android_smoke.py tested-apk/WildTrack-release.apk it.wildtrack.preview legacy-apk/WildTrack-release.apk
      - name: Retain native screenshots and per-step results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WildTrack-delivery-verification
          path: android-results/
          if-no-files-found: warn
