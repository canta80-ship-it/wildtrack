name: Verify Android upgrade installation
on:
  push:
    branches: [interface-reference]
    paths: [.github/workflows/verify-upgrade.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Wait for current signed release
        id: build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tool/wait_for_build.py
      - uses: actions/download-artifact@v4
        with:
          name: WildTrack-APK
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ github.token }}
          path: new-apk
      - uses: actions/download-artifact@v4
        with:
          name: WildTrack-APK
          run-id: 37144957188
          github-token: ${{ github.token }}
          path: old-apk
      - uses: actions/download-artifact@v4
        with:
          name: WildTrack-APK
          run-id: 37143999052
          github-token: ${{ github.token }}
          path: incompatible-apk
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Reproduce signature failure and verify update preserves app files
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install old-apk/WildTrack-release.apk
            adb root
            adb wait-for-device
            adb shell 'echo wildtrack-existing-data > /data/user/0/it.wildtrack.preview/cache/upgrade-sentinel'
            if adb install -r incompatible-apk/WildTrack-release.apk > incompatible-install.txt 2>&1; then exit 1; fi
            cat incompatible-install.txt
            grep INSTALL_FAILED_UPDATE_INCOMPATIBLE incompatible-install.txt
            adb install -r new-apk/WildTrack-release.apk
            adb shell cat /data/user/0/it.wildtrack.preview/cache/upgrade-sentinel | grep wildtrack-existing-data
            adb shell dumpsys package it.wildtrack.preview | grep versionName=0.7.18
