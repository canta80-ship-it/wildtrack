name: wildtrack_mvp
description: MVP outdoor per trekking, tracce GPS e avvistamenti fauna.
publish_to: 'none'
version: 0.7.17+24

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_map: ^8.3.2
  maplibre_gl: ^0.27.1
  latlong2: ^0.9.1
  geolocator: ^14.1.1
  sqflite: ^2.4.4
  path: ^1.9.1
  image_picker: ^1.2.3
  intl: ^0.20.2
  uuid: ^4.5.2
  url_launcher: ^6.3.2
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  firebase_auth: ^6.1.2
  permission_handler: ^12.0.1
  share_plus: ^13.3.0
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
  fonts:
    - family: serif
      fonts:
        - asset: assets/approved/editorial_serif.ttf
        - asset: assets/approved/editorial_serif.ttf
          weight: 700
        - asset: assets/approved/editorial_serif_italic.ttf
          style: italic
    - family: sans-serif
      fonts:
        - asset: assets/approved/interface_sans.ttf
        - asset: assets/approved/interface_sans.ttf
          weight: 700
    - family: WildTrackIcons
      fonts:
        - asset: assets/approved/wildtrack_icons.ttf
  assets:
    - nature_assets.json
    - intro_logo.jpg
    - intro_cervo.jpg
    - intro_lupo.jpg
    - intro_marmotta.jpg
    - intro_gufo.jpg
    - INTRO_CREDITS.txt
    - assets/approved/
    - assets/signs/

    - assets/radar_species/

